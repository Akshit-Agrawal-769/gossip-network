<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aunty Network 🫖</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🫖 Aunty Kitty Party</h1>
      <span class="me" id="me">connecting…</span>
      <span class="badge">📵 Internet: NOT REQUIRED</span>
    </header>

    <main>
      <aside>
        <h2>Aunties online</h2>
        <div id="aunties"></div>
        <h2>Gossip files</h2>
        <div id="files">
          <div class="net">No gossip yet. Kya ho gaya sabko?</div>
        </div>
        <h2>Network</h2>
        <div class="net" id="net"></div>
      </aside>
      <div id="chat"></div>
    </main>

    <footer>
      <input
        type="text"
        id="msg"
        placeholder="Type some gossip, beta…"
        autocomplete="off"
      />
      <button class="send" id="send">Send 📢</button>
      <label class="btn attach"
        >📎 Share file<input type="file" id="file" hidden
      /></label>
      <span
        class="fakebox"
        title="Demo: secretly change a file and forward it under an existing name"
      >
        <input type="checkbox" id="fake" /> 😈 Fake Aunty mode
        <select id="fakeAs" hidden></select>
      </span>
    </footer>

    <div id="haww">HAWWW!</div>

    <script src="script.js"></script>
  </body>
</html>
