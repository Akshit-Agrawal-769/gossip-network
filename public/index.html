<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aunty Network 🫖</title>
<style>
  :root{
    --pink:#c2185b; --pink-d:#880e4f; --gold:#ffb300; --cream:#fff8e7; --leaf:#2e7d32;
    --ink:#2b1a24; --muted:#7a6170; --bubble:#ffffff; --mine:#ffe0ec; --red:#d32f2f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);
       background:var(--cream);height:100vh;display:flex;flex-direction:column;font-size:18px}
  header{background:linear-gradient(90deg,var(--pink-d),var(--pink));color:#fff;padding:12px 20px;
         display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px #0003}
  header h1{margin:0;font-size:26px;letter-spacing:.3px}
  header .me{opacity:.9;font-size:15px}
  .badge{margin-left:auto;background:var(--gold);color:#3a2500;font-weight:700;padding:6px 12px;border-radius:999px;font-size:15px}
  main{flex:1;display:flex;min-height:0}
  aside{width:300px;background:#fff;border-right:3px solid #f3d9e4;overflow:auto;padding:14px}
  aside h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--pink);margin:14px 0 8px}
  .aunty{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:17px}
  .aunty .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#fde4ef}
  .dot{width:10px;height:10px;border-radius:50%;background:#bbb;margin-left:auto}
  .dot.on{background:#2ecc71;box-shadow:0 0 6px #2ecc71}
  .aunty.off{opacity:.45;text-decoration:line-through}
  .file{display:block;padding:8px;border-radius:10px;background:#fff6fa;margin-bottom:6px;font-size:15px;
        color:inherit;text-decoration:none;border:1px solid #f3d9e4;word-break:break-all}
  .file.fake{background:#ffebee;border-color:var(--red)}
  .file small{display:block;color:var(--muted);font-size:12px}
  .net{font-size:14px;color:var(--muted);line-height:1.5}
  .net b{color:var(--ink)}
  #chat{flex:1;overflow:auto;padding:18px 22px;
        background-image:radial-gradient(#f6d9e6 1.5px,transparent 1.5px);background-size:22px 22px}
  .row{display:flex;margin:10px 0;animation:pop .35s ease-out}
  .row.mine{justify-content:flex-end}
  .bubble{max-width:70%;background:var(--bubble);padding:10px 14px;border-radius:16px;box-shadow:0 1px 3px #0002;font-size:19px;line-height:1.35}
  .row.mine .bubble{background:var(--mine)}
  .bubble .who{font-weight:700;color:var(--pink);font-size:15px;margin-bottom:2px}
  .bubble .t{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
  .bubble a.dl{display:inline-block;margin-top:6px;background:var(--leaf);color:#fff;padding:5px 12px;border-radius:999px;text-decoration:none;font-size:15px}
  .bubble code{font-size:12px;word-break:break-all;color:var(--muted)}
  .row.system{justify-content:center}
  .row.system .bubble{background:#fff3c4;font-size:16px;text-align:center;max-width:85%}
  .row.fake .bubble{background:var(--red);color:#fff;font-weight:600;max-width:85%;animation:shake .6s}
  .row.fake .bubble code{color:#ffd6d6}
  footer{display:flex;gap:10px;padding:12px;background:#fff;border-top:3px solid #f3d9e4;align-items:center;flex-wrap:wrap}
  footer input[type=text]{flex:1;min-width:180px;font-size:18px;padding:12px 16px;border-radius:999px;border:2px solid #f3d9e4;outline:none}
  footer input[type=text]:focus{border-color:var(--pink)}
  button,.btn{font-size:17px;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:600}
  .send{background:var(--pink);color:#fff}
  .attach{background:var(--gold);color:#3a2500}
  .fakebox{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--red);font-weight:600}
  .fakebox select{font-size:15px;padding:6px;border-radius:8px}
  #haww{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:min(22vw,180px);
        font-weight:900;color:var(--pink);text-shadow:4px 4px 0 var(--gold);opacity:0}
  #haww.go{animation:haww 1.1s ease-out}
  @keyframes haww{0%{opacity:0;transform:scale(.3) rotate(-10deg)}25%{opacity:1;transform:scale(1.1) rotate(4deg)}70%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (max-width:760px){
    aside{display:none} .bubble{max-width:88%} header h1{font-size:20px} .badge{font-size:12px}
  }
</style>
</head>
<body>
<header>
  <h1>🫖 Aunty Kitty Party</h1>
  <span class="me" id="me">connecting…</span>
  <span class="badge">📵 Internet: NOT REQUIRED</span>
</header>

<main>
  <aside>
    <h2>Aunties online</h2>
    <div id="aunties"></div>
    <h2>Gossip files</h2>
    <div id="files"><div class="net">No gossip yet. Kya ho gaya sabko?</div></div>
    <h2>Network</h2>
    <div class="net" id="net"></div>
  </aside>
  <div id="chat"></div>
</main>

<footer>
  <input type="text" id="msg" placeholder="Type some gossip, beta…" autocomplete="off">
  <button class="send" id="send">Send 📢</button>
  <label class="btn attach">📎 Share file<input type="file" id="file" hidden></label>
  <span class="fakebox" title="Demo: secretly change a file and forward it under an existing name">
    <input type="checkbox" id="fake"> 😈 Fake Aunty mode
    <select id="fakeAs" hidden></select>
  </span>
</footer>

<div id="haww">HAWWW!</div>

<script>
const $ = (id) => document.getElementById(id);
const EMOJIS = ["👵","🧕","👩‍🦳","💁‍♀️","🙆‍♀️","👩‍🦱","🤷‍♀️","💃"];
const avatar = (name) => EMOJIS[[...name].reduce((s,c)=>s+c.charCodeAt(0),0) % EMOJIS.length];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const time = (t) => new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
let me = "";

// ---- Sound: a little synthesized "haww" whistle (no audio files needed) ----
let ctx;
function haww(dramatic){
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = dramatic ? "sawtooth" : "triangle";
    o.frequency.setValueAtTime(dramatic ? 300 : 900, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(dramatic ? 120 : 380, ctx.currentTime + 0.5);
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.6);
  }catch(e){}
  const h = $("haww"); h.textContent = dramatic ? "FAKE!!" : "HAWWW!";
  h.classList.remove("go"); void h.offsetWidth; h.classList.add("go");
}
document.addEventListener("click", () => { ctx = ctx || new (window.AudioContext||window.webkitAudioContext)(); }, {once:true});

// ---- Rendering ----
function bubble(b){
  const row = document.createElement("div");
  let cls = "row";
  if (b.kind === "system") cls += " system";
  if (b.kind === "fake") cls += " fake";
  if (b.kind === "mine" || b.mine) cls += " mine";
  row.className = cls;
  let html = "";
  if (b.kind === "chat" || b.kind === "file" || b.kind === "mine") {
    if (!(b.kind === "mine" || b.mine)) html += `<div class="who">${avatar(b.from)} ${esc(b.from)}</div>`;
  }
  html += `<div>${esc(b.text)}</div>`;
  if (b.cid && b.kind !== "fake") html += `<a class="dl" href="/file/${b.cid}">⬇ ${esc(b.file)}</a>`;
  if (b.kind === "fake") html += `<div style="margin-top:6px"><code>original fingerprint: ${esc(b.original)}</code><br><code>this forward: ${esc(b.cid)}</code></div>`;
  html += `<div class="t">${time(b.time)}</div>`;
  row.innerHTML = `<div class="bubble">${html}</div>`;
  $("chat").appendChild(row);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function renderState(s){
  me = s.me;
  $("me").textContent = `You are ${avatar(s.me)} ${s.me}`;
  $("aunties").innerHTML =
    `<div class="aunty"><span class="av">${avatar(s.me)}</span>${esc(s.me)} (you)<span class="dot on"></span></div>` +
    s.aunties.map(a=>`<div class="aunty ${a.online?"":"off"}"><span class="av">${avatar(a.name)}</span>${esc(a.name)}<span class="dot ${a.online?"on":""}"></span></div>`).join("");
  $("files").innerHTML = s.files.length ? s.files.map(f=>`
    <a class="file ${f.fake?"fake":""}" href="/file/${f.cid}">${f.fake?"🚨 ":"📄 "}${esc(f.filename)}
      <small>from ${esc(f.from)} · ${f.status}${f.fake?" · TAMPERED":""}</small></a>`).join("")
    : `<div class="net">No gossip yet. Kya ho gaya sabko?</div>`;
  $("net").innerHTML = `Phones on this hotspot can open:<br>${s.ips.map(ip=>`<b>http://${ip}:${s.port}</b>`).join("<br>")||"<b>(no network)</b>"}
    <br><span id="peers"></span>`;
  // Fake Aunty: choose which existing file to impersonate
  const names = Object.keys(s.registry);
  $("fakeAs").innerHTML = names.map(n=>`<option>${esc(n)}</option>`).join("");
  refreshPeers();
}

async function refreshPeers(){
  try{
    const p = await (await fetch("/peers")).json();
    const el = $("peers"); if (el) el.innerHTML = `IPFS peers connected: <b>${p.count}</b>`;
  }catch(e){}
}
setInterval(refreshPeers, 5000);

// ---- Live updates from our server ----
const es = new EventSource("/events");
es.addEventListener("init", (e) => { const d = JSON.parse(e.data); $("chat").innerHTML=""; d.feed.forEach(bubble); renderState(d); });
es.addEventListener("state", (e) => renderState(JSON.parse(e.data)));
es.addEventListener("bubble", (e) => {
  const b = JSON.parse(e.data); bubble(b);
  if (b.kind === "file") haww(false);
  if (b.kind === "fake") haww(true);
});
es.onerror = () => { $("me").textContent = "reconnecting to aunty server…"; };

// ---- Actions ----
async function sendChat(){
  const text = $("msg").value.trim(); if (!text) return;
  $("msg").value = "";
  await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text})});
}
$("send").onclick = sendChat;
$("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });

$("fake").onchange = () => { $("fakeAs").hidden = !$("fake").checked; };
$("file").onchange = async () => {
  const f = $("file").files[0]; if (!f) return;
  let url = `/upload?name=${encodeURIComponent(f.name)}`;
  if ($("fake").checked && $("fakeAs").value) url += `&fakeAs=${encodeURIComponent($("fakeAs").value)}`;
  const r = await fetch(url, {method:"POST", body: f});
  if (!r.ok) alert("Upload failed: " + (await r.text()));
  $("file").value = "";
};
</script>
</body>
</html>
